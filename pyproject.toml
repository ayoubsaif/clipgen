[project]
name = "clipgen"
version = "0.1.0"
description = "Turn Twitch, Kick and YouTube videos into vertical short clips with local transcription and LLM selection."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=0.75",
    "fastapi>=0.120",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6",
    "keyring>=25.7.0",
    "numpy>=2",
    "openai>=2",
    "pillow>=12",
    "streamlit>=1.67.0",
    "uvicorn>=0.34",
    "yt-dlp[default]>=2026.10.26",
]

[project.optional-dependencies]
gpu = ["nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'"]

[project.scripts]
clipgen = "clipgen.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
